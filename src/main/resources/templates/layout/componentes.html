<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Componentes Base</title>
</head>
<body>

<!-- Fragmento menú de navegación -->
<nav th:fragment="menu-principal" class="navbar navbar-expand-lg navbar-dark" style="background-color: #212529; padding-top: 15px; padding-bottom: 15px;">
    <div class="container-fluid px-4">

        <!-- Título del sistema -->
        <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
            SIGAVT<span style="color: #e86c27;">.</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4">
                <li class="nav-item me-3"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item me-3"><a class="nav-link" th:href="@{/ventas}">Ventas</a></li>
                <li class="nav-item me-3"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item me-3"><a class="nav-link" th:href="@{/proveedores}">Proveedores</a></li>
                <li class="nav-item me-3"><a class="nav-link" th:href="@{/reportes}">Reportes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
            </ul>

            <!-- Perfil de usuario -->
            <div class="d-flex align-items-center text-white">
                <div class="rounded-circle d-flex justify-content-center align-items-center me-2 shadow-sm"
                     style="width: 35px; height: 35px; background-color: #e86c27; font-size: 0.85rem; font-weight: bold;">
                    Us
                </div>
                <span class="fs-6">Usuario</span>
            </div>
        </div>
    </div>
</nav>

<!-- Fragmento pie de página -->
<footer th:fragment="pie-pagina" style="background-color: #212529; color: #a0a0a0;" class="text-center py-4 mt-auto">
    <div class="container">
        <p class="mb-1 fw-semibold text-light">Sistema de Gestión y Análisis de Ventas para Taquería (SIGAVT) &copy; 2026</p>
        <p class="mb-0"><small>Daniel Nicolás Feregrino</small></p>
    </div>

    <!-- Script para el menú activo -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let rutaActual = window.location.pathname;
            let enlaces = document.querySelectorAll('.navbar-nav .nav-link');

            enlaces.forEach(function(enlace) {
                let rutaEnlace = enlace.getAttribute('href');

                if (rutaActual === rutaEnlace || (rutaEnlace !== '/' && rutaActual.startsWith(rutaEnlace))) {
                    enlace.classList.add('active', 'fw-semibold', 'text-white');
                    enlace.classList.remove('text-light');
                    enlace.style.borderBottom = '2px solid #e86c27';
                } else {
                    enlace.classList.add('text-light');
                    enlace.classList.remove('active', 'fw-semibold', 'text-white');
                    enlace.style.borderBottom = 'none';
                }
            });
        });
    </script>
</footer>

</body>
</html>
