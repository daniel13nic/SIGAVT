<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SIGAVT</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="d-flex align-items-center py-4" style="height: 100vh;">

<main class="form-signin w-100 m-auto" style="max-width: 400px;">
    <div class="card tarjeta-acceso">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <h1 class="h3 mb-3 fw-bold text-naranja">SIGAVT</h1>
                <p class="text-muted">Sistema de Gestión de Taquería</p>
            </div>

            <!-- Alertas de Spring Security -->
            <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                Usuario o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
                Has cerrado sesión correctamente.
            </div>

            <!-- Formulario de Login -->
            <form th:action="@{/login}" method="post">

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required autofocus>
                    <label for="username">Usuario</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                    <label for="password">Contraseña</label>
                </div>

                <button class="w-100 btn btn-lg btn-naranja" type="submit">Ingresar</button>
            </form>
        </div>
    </div>
</main>

</body>
</html>
